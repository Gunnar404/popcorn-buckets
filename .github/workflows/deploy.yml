name: Deploy site

# Redeploy when the site or scripts change by hand.
on:
  push:
    branches: [main]
    paths: ["site/**", "scripts/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: popcorn-buckets
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
