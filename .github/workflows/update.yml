name: Popcorn bucket tracker

# The research itself runs as a scheduled Claude Code session (see RESEARCH.md),
# which pushes findings/latest.json. This workflow merges those findings into the
# site, downloads photos, and publishes. No API key needed.
on:
  push:
    branches: [main]
    paths: ["findings/**"]
  workflow_dispatch: # re-merge the latest findings / retry missing photos

permissions:
  contents: write # commit refreshed data back to the repo
  pages: write
  id-token: write

concurrency:
  group: popcorn-buckets
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
      - name: Check findings
        run: node scripts/check-findings.mjs findings/latest.json
      - name: Merge findings and fetch photos
        run: node scripts/update.mjs --fixture findings/latest.json
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - name: Commit changes
        run: |
          git config user.name "popcorn-bucket-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Popcorn buckets: update $(date -u +%F)"
            git pull --rebase origin main
            git push
          fi

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }} # picks up the commit the update job just pushed
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
