name: Popcorn bucket tracker

on:
  schedule:
    - cron: "0 13 * * 1" # every Monday 13:00 UTC (8–9am Eastern)
  workflow_dispatch: # "Run workflow" button for an on-demand refresh
  push:
    branches: [main]
    paths: ["site/**", "scripts/**"] # redeploy when the site code changes

permissions:
  contents: write # commit refreshed data back to the repo
  pages: write
  id-token: write

concurrency:
  group: popcorn-buckets
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
      - name: Find new buckets
        run: npm run update
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - name: Commit changes
        run: |
          git config user.name "popcorn-bucket-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Popcorn buckets: weekly update $(date -u +%F)"
            git push
          fi

  deploy:
    needs: update
    if: always() && (needs.update.result == 'success' || needs.update.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }} # picks up the commit the update job just pushed
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
